<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Catalog produse</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e4e2dd;
    --text: #2b2a27;
    --muted: #767268;
    --accent: #b45309;
    --ok: #2f7d4f;
    --zero: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 16px 12px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 20px;
    margin: 0;
  }
  .nav-link {
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    margin-left: 12px;
  }
  #search {
    width: 100%;
    padding: 14px 16px;
    font-size: 17px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    background: var(--card);
    margin-bottom: 10px;
  }
  #search:focus { border-color: var(--accent); }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filters select {
    flex: 1;
    min-width: 130px;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
  }
  #status {
    font-size: 13px;
    color: var(--muted);
    margin-top: 10px;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 12px 16px 40px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .badge {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge.ok { background: #e7f3ec; color: var(--ok); }
  .badge.zero { background: #fbeaea; color: var(--zero); }
  .card .name {
    font-weight: 600;
    font-size: 15px;
    margin: 10px 0 2px;
  }
  .card .brand {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
  }
  .card .price {
    font-size: 15px;
    margin: 10px 0 0;
  }
  .variants-box {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .variants-box .vlabel {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    margin: 0 0 2px;
  }
  .variant-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    gap: 8px;
  }
  .variant-row .vinfo { min-width: 0; }
  .variant-row .qty.ok { color: var(--ok); }
  .variant-row .qty.zero { color: var(--zero); }
  .variant-row .print-label-btn {
    margin-top: 4px;
    font-size: 11px;
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
  .variant-row .print-label-btn:active { background: #f0efeb; }
  .empty {
    text-align: center;
    color: var(--muted);
    margin-top: 40px;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>Catalog produse</h1>
    <div>
      <a class="nav-link" href="/">← Căutare stoc</a>
      <a class="nav-link" href="/etichete.html">Etichete →</a>
      <a class="nav-link" href="/verificare.html">Verificare →</a>
    </div>
  </div>
  <input id="search" type="text" placeholder="Caută un model, brand, culoare…" autofocus />
  <div class="filters">
    <select id="filter-brand"><option value="">Brand: toate</option></select>
    <select id="filter-familia"><option value="">Familia: toate</option></select>
  </div>
  <div id="status">Se încarcă…</div>
</header>

<main id="grid" class="grid"></main>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="label.js"></script>
<script src="label-print.js"></script>
<script src="catalog.js"></script>
</body>
</html>
