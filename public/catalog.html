<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Catalog produse</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e4e2dd;
    --text: #2b2a27;
    --muted: #767268;
    --accent: #b45309;
    --ok: #2f7d4f;
    --zero: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 16px 12px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 20px;
    margin: 0;
  }
  .nav-link {
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    margin-left: 12px;
  }
  #search {
    width: 100%;
    padding: 14px 16px;
    font-size: 17px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    background: var(--card);
    margin-bottom: 10px;
  }
  #search:focus { border-color: var(--accent); }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
