<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Căutare stoc</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e4e2dd;
    --text: #2b2a27;
    --muted: #767268;
    --accent: #b45309;
    --ok: #2f7d4f;
    --zero: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 16px 12px;
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 12px;
  }
  #search {
    width: 100%;
    padding: 14px 16px;
    font-size: 17px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    background: var(--card);
  }
  #search:focus { border-color: var(--accent); }
  #status {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
  }
  .title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .nav-link {
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    margin-left: 10px;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 16px 40px;
  }
  .row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
  }
  .row .main-info { min-width: 0; }
  .row .name {
    font-weight: 600;
    font-size: 15px;
  }
  .row .meta {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
    overflow-wrap: break-word;
  }
  .row .stock {
    text-align: right;
    flex-shrink: 0;
  }
  .row .qty {
    font-size: 22px;
    font-weight: 700;
  }
  .qty.ok { color: var(--ok); }
  .qty.zero { color: var(--zero); }
  .row .price {
    font-size: 13px;
    color: var(--muted);
  }
  .row-main {
    border: 2px solid var(--accent);
  }
  .variants-heading {
    margin-top: 20px;
    margin-bottom: 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    margin-top: 40px;
    font-size: 14px;
  }
  .search-row {
    display: flex;
    gap: 8px;
  }
  #search { flex: 1; }
  #scan-btn {
    flex-shrink: 0;
    width: 52px;
    font-size: 22px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    cursor: pointer;
  }
  #scan-btn:active { background: #f0efeb; }
  .scanner-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 1000;
    display: flex;
    flex-direction: column;
  }
  #reader {
    flex: 1;
  }
  #scan-close {
    padding: 16px;
    font-size: 16px;
    background: #111;
    color: #fff;
    border: none;
  }
  .scan-hint {
    color: #fff;
    text-align: center;
    font-size: 13px;
    padding: 8px;
    background: #000;
  }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>Căutare stoc</h1>
    <div>
      <a class="nav-link" href="/catalog.html">Catalog →</a>
      <a class="nav-link" href="/etichete.html">Etichete →</a>
      <a class="nav-link" href="/verificare.html">Verificare →</a>
    </div>
  </div>
  <div class="search-row">
    <input id="search" type="text" placeholder="Caută după cod, denumire, culoare, brand…" autofocus />
    <button id="scan-btn" aria-label="Scanează cod de bare">📷</button>
  </div>
  <div id="status">Se încarcă…</div>
</header>

<main id="results"></main>

<div id="scanner-overlay" class="scanner-overlay" style="display:none;">
  <div class="scan-hint">Îndreaptă camera spre codul de bare</div>
  <div id="reader"></div>
  <button id="scan-close">✕ Închide</button>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="label.js"></script>
<script src="label-print.js"></script>
<script src="app.js"></script>
</body>
</html>
