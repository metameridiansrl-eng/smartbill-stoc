<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Căutare stoc</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e4e2dd;
    --text: #2b2a27;
    --muted: #767268;
    --accent: #b45309;
    --ok: #2f7d4f;
    --zero: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 16px 12px;
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 12px;
  }
  #search {
    width: 100%;
    padding: 14px 16px;
    font-size: 17px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    background: var(--card);
  }
  #search:focus { border-color: var(--accent); }
  #status {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 16px 40px;
  }
  .row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
  }
  .row .main-info { min-width: 0; }
  .row .name {
    font-weight: 600;
    font-size: 15px;
  }
  .row .meta {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
    overflow-wrap: break-word;
  }
  .row .stock {
    text-align: right;
    flex-shrink: 0;
  }
  .row .qty {
    font-size: 22px;
    font-weight: 700;
  }
  .qty.ok { color: var(--ok); }
  .qty.zero { color: var(--zero); }
  .row .price {
    font-size: 13px;
    color: var(--muted);
  }
  .empty {
    text-align: center;
    color: var(--muted);
    margin-top: 40px;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>Căutare stoc</h1>
  <input id="search" type="text" placeholder="Caută după cod, denumire, culoare, brand…" autofocus />
  <div id="status">Se încarcă…</div>
</header>

<main id="results"></main>

<script src="app.js"></script>
</body>
</html>
